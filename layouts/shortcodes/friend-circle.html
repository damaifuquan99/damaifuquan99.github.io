<div class="friend-circle">
  <div class="friend-circle__toolbar">
    <input class="friend-circle__search" type="search" placeholder="搜索文章或朋友" data-fc-search>
    <select class="friend-circle__select" data-fc-friend>
      <option value="">全部朋友</option>
      {{ $items := site.Data.friend_circle }}
      {{ $friends := slice }}
      {{ range $items }}
        {{ $friends = $friends | append .friend }}
      {{ end }}
      {{ range $friends | uniq }}
        <option value="{{ . }}">{{ . }}</option>
      {{ end }}
    </select>
  </div>

  <div class="friend-circle__list" data-fc-list>
    {{ range $items }}
      <article class="friend-circle__item" data-fc-item data-friend="{{ .friend }}" data-text="{{ .friend }} {{ .title }}">
        <div class="friend-circle__meta">
          <span class="friend-circle__friend">{{ .friend }}</span>
          <time class="friend-circle__date" datetime="{{ .date }}">{{ .date }}</time>
        </div>
        <a class="friend-circle__link" href="{{ .url }}" target="_blank" rel="noopener">
          {{ .title }}
        </a>
      </article>
    {{ end }}
  </div>

  <div class="friend-circle__more">
    <button type="button" data-fc-more>Load More</button>
  </div>

  <p class="friend-circle__empty is-hidden" data-fc-empty>没有匹配的文章。</p>
</div>

<link rel="stylesheet" href="/css/friend-circle.css">
<script src="/js/friend-circle.js" defer></script>
